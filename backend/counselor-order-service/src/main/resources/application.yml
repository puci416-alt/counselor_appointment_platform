server:
  port: 8082

spring:
  application:
    name: counselor-order-service

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/counselor_platform?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1
        port: 8082

    sentinel:
      transport:
        dashboard: 127.0.0.1:8080
        port: 8719                      # 客户端与控制台通信端口，避免冲突
      eager: true                       # 启动时立即注册到控制台
      web-context-unify: false          # 区分不同 URL 的限流
      filter:
        enabled: false

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: appointment-notify-group
      auto-offset-reset: earliest
      enable-auto-commit: false      # 手动提交 offset
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.counselor.order.dto
    listener:
      ack-mode: manual               # 手动 ack
      concurrency: 3                 # 3 个并发消费者


mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.counselor.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    com.counselor: debug